# autorace_mission parameters. Doubles MUST keep a decimal point (ROS 2 rejects 1 for a double).
# Distances in metres are from the Gazebo world (autorace_gazebo v014, 260/227 scale) unless noted.
mission_fsm:
  ros__parameters:
    # inputs
    sign_topics: [/parking, /left, /right, /no_entry, /stop, /construction, /intersection, /tunnel]   # mission_model order
    odom_topic: /odom
    scan_topic: /scan
    image_topic: /camera2          # front camera (traffic light, barrier)
    lidar_x: -0.032                # LiDAR position ahead of base_link
    rate_hz: 10.0
    status_period: 1.0
    publish_debug: true            # /mission/debug/compressed while a camera check runs

    start_mode: light              # light = wait for green | go = drive at once
    missions: [intersection, construction, parking, level_crossing, tunnel]
    pending_m: 1.0                 # a sign seen during another mission still starts its mission within this
    intersection_on_turn_sign: false   # true: /left /right start the intersection without the triangle
                                       # (practice map only; on the course the parking left arrow would too)

    traffic_light:
      need_red_first: true         # accept green only after a red (guards a static false green)
      green_frames: 2
      fallback_s: 0.0              # >0: go this long after the last red/yellow even without green
      no_camera_go_s: 0.0          # >0: go if no front-camera frame arrived this long (sim.launch sets 5.0)
      no_red_after_s: 4.0          # waited this long and never saw a red -> green alone starts us (red lens outside the ROI)

    intersection:                  # /intersection (triangle) arms (slow), then exactly one of /left /right
      arm_timeout_m: 4.0
      left_line: yellow            # outer line of the left branch (robot drives with yellow on its left)
      right_line: white            # outer line of the right branch
      around_deg: 140.0            # exit by heading: round the island end (~180 deg away from the sign side)
      exit_deg: 50.0               #   then turned back toward the sign side (~90 deg) = into the exit
      exit_m: 0.25                 #   then this far more on the outer line, then both lines
      max_m: 5.0                   # m after the decision without that pattern -> both lines anyway
      timeout_s: 120.0

    construction:                  # follow the line of the current corridor, odometry lane change between
      start_line: white            # Gazebo: box 1 sits at the inner (yellow) corner -> enter on white
      spacing: 0.285               # corridor centre to centre
      corridor_half: 0.12
      sweep_from: 0.08
      sweep_ahead: 0.30
      look_ahead: 0.55
      beside_back: 0.10            # rear overhang behind the axle
      min_points: 3
      aligned_deg: 25.0
      change_v: 0.05
      change_lookahead: 0.12
      change_done_m: 0.025
      change_done_deg: 10.0
      change_max_m: 0.7
      done_clear_m: 0.6
      max_m: 5.0

    parking:                       # spur on the left -> lot of 3 columns (stall | corridor | stall)
      spur_turn_deg: 80.0
      spur_angle_deg: 90.0
      spur_lane_m: 0.45
      lot_drive_m: 0.49
      occupied_range: 0.45
      default_side: left           # Gazebo has no house robot: both stalls free
      bay_drive_m: 0.30            # footprint centred in the stall (axle 0.015 m deeper than the stall centre)
      anchor_from_m: 0.15          # corridor heading re-taken from /lane/centre in the spur (odometry yaw error)
      anchor_min: 5
      anchor_max_dev_deg: 15.0
      park_wait_s: 1.5
      scan_wait_s: 0.6
      exit_turn_deg: 60.0
      exit_lane_m: 0.25
      v: 0.06
      arm_max_m: 2.5

    level_crossing:                # /stop arms; stop when the bar is down, go when it is up
      down_frames: 2
      up_frames: 5
      use_lidar: true
      lidar_x: 0.35
      lidar_half_width: 0.10
      lidar_points: 3
      approach_max_m: 2.0
      max_wait_s: 25.0             # bar "down" this long = camera rule stuck -> creep on LiDAR (never drive through blind)
      creep_v: 0.02
      creep_lidar_x: 0.20
      go_m: 0.35

    tunnel:                        # dark: LiDAR grid built while driving + path to the exit (no map file)
      lost_updates: 3
      enter_max_m: 0.5
      wall_both: 0.35              # walls on both sides closer than this = entrance = tunnel frame origin
      approach_max_m: 0.6
      approach_v: 0.06
      exit_fwd: 2.01               # MEASURE: entrance wall OUTER face -> exit lane centre, along the entry, + 0.11
      exit_left: 1.95              # MEASURE: entry lane centre line -> inner face of the exit wall (right: negative)
                                   # (Gazebo v014 values; 2025 team's Nav2 goal: 1.42 ahead / 1.86 left of
                                   #  their start inside, leaving at +93 deg. +-0.2 m still finds the opening)
      inside_m: 0.30
      outside_m: 0.40              # target this far beyond the opening
      reach_m: 0.15
      replan_s: 1.0
      scan_gate_deg: 4.0           # scan into the grid only when turned less than this since the last one (5 Hz sweep smear)
      lookahead: 0.25
      stall_s: 10.0                # no progress along the path this long -> wall following escape_m
      stall_progress: 0.05
      escape_m: 0.6
      good_updates: 4              # lane lines again (inside the exit) -> back to the lane
      max_s: 120.0
      exit_m: 0.15
      gap_half_width: 0.11         # LiDAR safety corridor half width (robot ~0.10)
      gap_min_free: 0.25
      gap_v: 0.08
      grid_res: 0.03
      grid_max_r: 0.8              # only LiDAR points this close into the grid (range noise +-3.5 % beyond 0.5 m)
      grid_r_hard: 0.11            # path never closer to an obstacle than this
      grid_r_soft: 0.25            # and prefers to stay this far
      grid_soft_cost: 3.0
      wall_side: right             # wall following only for the escape
      wall_d_wall: 0.20
      wall_v: 0.08
      wall_k_d: 4.0
      wall_k_a: 1.5
      wall_front_slow: 0.40
      wall_front_turn: 0.30
      wall_front_stop: 0.16
      wall_w_turn: 0.9
      wall_w_seek: 0.45
      wall_gap_straight_m: 0.30
      wall_w_max: 1.0

    light:                         # traffic light colour rule (ROI = image fractions x0 y0 x1 y1)
      roi: [0.35, 0.0, 1.0, 0.75]
      v_min: 170
      s_min: 120
      min_area: 0.0004
      max_area: 0.03
      min_fill: 0.45
      max_aspect: 2.5

    bar:                           # barrier rule: red spans >= min_width of the image = lowered
      roi: [0.0, 0.15, 1.0, 0.85]
      v_min: 70
      s_min: 110
      min_width: 0.35
      min_px: 0.004

cmd_vel_mux:
  ros__parameters:
    lane_topic: /cmd_vel_lane
    mission_topic: /cmd_vel_mission
    mode_topic: /mission/drive
    out_topic: cmd_vel
    source_timeout: 0.5
    mode_timeout: 1.0
    tick_hz: 20.0
    accel: 0.3                     # m/s^2: forward speed rises at most this fast after a stop (0.18 m/s in 0.6 s)
